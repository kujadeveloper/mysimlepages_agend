<section id="order-tracking" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-xl text-center">
    <h2 class="text-3xl font-bold md:text-4xl">Sipariş Takip</h2>
    <p class="mt-4 opacity-80">Sipariş numaranız onay e-postanızda “VX-” ile başlar.</p>
    <form class="mt-8 space-y-4 rounded-2xl bg-white/5 p-6 text-left ring-1 ring-white/10">
      <div><label for="t-order" class="block font-semibold">Sipariş numarası</label><input id="t-order" name="order" type="text" placeholder="VX-2026-" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
      <div><label for="t-email" class="block font-semibold">E-posta</label><input id="t-email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
      <button type="submit" class="w-full rounded-lg bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Siparişimi Bul</button>
    </form>
  </div>
</section>
