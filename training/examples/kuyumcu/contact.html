<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold text-[var(--primary)] md:text-4xl">Randevu</h2>
      <p class="mt-4 text-lg opacity-80">Tasarım görüşmeleri için mağazamızın üst katında size özel bir saat ayırıyoruz.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Adres:</span> Kapalıçarşı, Kalpakçılar Cad. No: 88, Fatih / İstanbul</p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">Telefon:</span> <a href="tel:+902125190088" class="underline">0212 519 00 88</a></p>
      <p class="mt-2 opacity-70">Pazartesi – Cumartesi 09:00 – 19:00</p>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="interest" class="block font-semibold">İlgi alanı</label><select id="interest" name="interest" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Tektaş</option><option>Alyans</option><option>Özel tasarım</option><option>Taş yenileme</option></select></div>
        <div><label for="date" class="block font-semibold">Tarih</label><input id="date" name="date" type="date" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Randevu İste</button>
    </form>
  </div>
</section>
