<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-extrabold md:text-4xl">Test sürüşü</h2>
      <p class="mt-4 text-lg opacity-80">30 dakika boyunca Kordon'da istediğin modeli dene. Kask bizden.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Mağaza:</span> Alsancak Mah. Atatürk Cad. No: 210/A, Konak / İzmir</p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">Telefon:</span> <a href="tel:+902324220210" class="underline">0232 422 02 10</a></p>
    </div>
    <form class="space-y-5 rounded-3xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="model" class="block font-semibold">Model</label><select id="model" name="model" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Volta City</option><option>Volta Fold</option><option>Volta Trail</option></select></div>
        <div><label for="date" class="block font-semibold">Tarih</label><input id="date" name="date" type="date" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Randevu Al</button>
    </form>
  </div>
</section>
