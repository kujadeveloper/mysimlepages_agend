<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Contact</h2>
      <ul class="mt-8 space-y-4">
        <li><span class="font-semibold text-[var(--primary)]">Clinic:</span> Güzeloba Mah. Lara Cad. No: 145, Muratpaşa, Antalya, Türkiye</li>
        <li><span class="font-semibold text-[var(--primary)]">WhatsApp:</span> <a href="https://wa.me/905423100500" class="underline">+90 542 310 05 00</a></li>
        <li><span class="font-semibold text-[var(--primary)]">Email:</span> <a href="mailto:hello@larasmile.com" class="underline">hello@larasmile.com</a></li>
      </ul>
    </div>
    <form class="space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="c-name" class="block font-semibold">Name</label><input id="c-name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="c-email" class="block font-semibold">Email</label><input id="c-email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="c-subject" class="block font-semibold">Subject</label><input id="c-subject" name="subject" type="text" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="c-message" class="block font-semibold">Message</label><textarea id="c-message" name="message" rows="4" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Send message</button>
    </form>
  </div>
</section>
