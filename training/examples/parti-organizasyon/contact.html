<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-3xl">
    <h2 class="text-3xl font-bold md:text-4xl">Partiyi Planlayalım</h2>
    <p class="mt-4 text-lg opacity-80">Hafta sonları 3 hafta önceden doluyor. Formu doldurun ya da <a href="https://wa.me/905317770101" class="font-semibold text-[var(--primary)] underline">WhatsApp'tan yazın</a>.</p>
    <form class="mt-10 space-y-5 rounded-3xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="parent" class="block font-semibold">Veli adı</label><input id="parent" name="parent" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="age" class="block font-semibold">Çocuğun yaşı</label><input id="age" name="age" type="number" min="1" max="12" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="theme" class="block font-semibold">Tema</label><select id="theme" name="theme" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Uzay</option><option>Deniz Kızı</option><option>Dinozor</option><option>Süper Kahraman</option><option>Prenses</option><option>Blok Dünyası</option><option>Başka</option></select></div>
        <div><label for="date" class="block font-semibold">Tarih</label><input id="date" name="date" type="date" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="kids" class="block font-semibold">Çocuk sayısı</label><input id="kids" name="kids" type="number" min="5" value="15" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Teklif İste</button>
    </form>
  </div>
</section>
