<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold uppercase md:text-4xl">İletişim</h2>
      <ul class="mt-8 space-y-4">
        <li><span class="font-bold text-[var(--primary)]">Genel merkez:</span> Huzurkent Mah. 2016 Cad. No: 47, Akdeniz / Mersin</li>
        <li><span class="font-bold text-[var(--primary)]">Telefon:</span> <a href="tel:+903242380047" class="underline">0324 238 00 47</a></li>
        <li><span class="font-bold text-[var(--primary)]">E-posta:</span> <a href="mailto:info@akdenizhat.com.tr" class="underline">info@akdenizhat.com.tr</a></li>
      </ul>
    </div>
    <form class="space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="c-name" class="block font-semibold">Ad Soyad</label><input id="c-name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="c-email" class="block font-semibold">E-posta</label><input id="c-email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="c-subject" class="block font-semibold">Konu</label><input id="c-subject" name="subject" type="text" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="c-message" class="block font-semibold">Mesajınız</label><textarea id="c-message" name="message" rows="4" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Gönder</button>
    </form>
  </div>
</section>
