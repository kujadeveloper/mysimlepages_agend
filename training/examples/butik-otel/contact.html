<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Rezervasyon Talebi</h2>
      <p class="mt-4 text-lg opacity-80">Müsaitliği kontrol edip 2 saat içinde fiyat ve ödeme bilgisiyle dönüyoruz.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Telefon:</span> <a href="tel:+902327160890" class="underline">0232 716 08 90</a></p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">WhatsApp:</span> <a href="https://wa.me/905327160890" class="underline">0532 716 08 90</a></p>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="checkin" class="block font-semibold">Giriş</label><input id="checkin" name="checkin" type="date" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="checkout" class="block font-semibold">Çıkış</label><input id="checkout" name="checkout" type="date" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="room" class="block font-semibold">Oda</label><select id="room" name="room" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Bahçe Odası</option><option>Havuz Manzaralı</option><option>Teraslı Süit</option></select></div>
        <div><label for="guests" class="block font-semibold">Kişi</label><input id="guests" name="guests" type="number" min="1" max="3" value="2" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Talep Gönder</button>
    </form>
  </div>
</section>
