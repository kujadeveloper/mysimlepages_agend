<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-4xl">
    <h2 class="text-3xl font-bold md:text-4xl">Let's work together</h2>
    <p class="mt-4 text-lg opacity-80">Email me directly at <a href="mailto:hello@emrekilic.dev" class="text-[var(--primary)] underline">hello@emrekilic.dev</a> or use the form. I reply within a day.</p>
    <form class="mt-10 space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block text-sm font-semibold">Name</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="email" class="block text-sm font-semibold">Email</label><input id="email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="details" class="block text-sm font-semibold">Project details</label><textarea id="details" name="details" rows="4" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Send</button>
    </form>
    <div class="mt-10 flex gap-6 font-mono text-sm"><a href="https://github.com/emrekilic" class="hover:text-[var(--primary)]">GitHub</a><a href="https://linkedin.com/in/emrekilic" class="hover:text-[var(--primary)]">LinkedIn</a></div>
  </div>
</section>
