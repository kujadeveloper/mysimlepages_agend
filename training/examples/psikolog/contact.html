<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-5xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">İletişim</h2>
      <p class="mt-4 text-lg opacity-80">Formu doldurmanız bir taahhüt değildir. İki iş günü içinde size dönerek uygun bir görüşme zamanı planlarız.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Muayenehane:</span> Teşvikiye Mah. Rumeli Cad. No: 34 D: 5, Şişli / İstanbul</p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">E-posta:</span> <a href="mailto:iletisim@defneaksoy.com" class="underline">iletisim@defneaksoy.com</a></p>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div><label for="name" class="block font-semibold">Adınız</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="mode" class="block font-semibold">Tercihiniz</label><select id="mode" name="mode" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Yüz yüze</option><option>Online</option></select></div>
      <div><label for="note" class="block font-semibold">Kısa not (isteğe bağlı)</label><textarea id="note" name="note" rows="3" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Gönder</button>
    </form>
  </div>
</section>
