<section id="register" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-2xl">
    <h2 class="text-center text-4xl font-bold">Üye Kayıt</h2>
    <p class="mt-4 text-center opacity-70">Kaydınız kulüp sekreterliği tarafından 24 saat içinde onaylanır.</p>
    <form class="mt-10 space-y-5 rounded-2xl bg-white p-6 text-[#18181b]">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="r-name" class="block font-semibold">Ad Soyad</label><input id="r-name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-year" class="block font-semibold">Doğum yılı</label><input id="r-year" name="birth_year" type="number" min="1930" max="2021" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-email" class="block font-semibold">E-posta</label><input id="r-email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-phone" class="block font-semibold">Telefon</label><input id="r-phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-plan" class="block font-semibold">Üyelik tipi</label><select id="r-plan" name="plan" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Öğrenci · 600 ₺/ay</option><option>Yetişkin · 900 ₺/ay</option><option>Aile · 14.000 ₺/yıl</option></select></div>
        <div><label for="r-elo" class="block font-semibold">ELO puanı (varsa)</label><input id="r-elo" name="elo" type="number" min="0" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-pass" class="block font-semibold">Şifre</label><input id="r-pass" name="password" type="password" minlength="8" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="r-pass2" class="block font-semibold">Şifre tekrar</label><input id="r-pass2" name="password_confirm" type="password" minlength="8" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <label class="flex items-start gap-3 text-sm"><input type="checkbox" name="kvkk" required class="mt-1"><span>Kulüp tüzüğünü ve KVKK aydınlatma metnini okudum.</span></label>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Kaydı Tamamla</button>
      <p class="text-center text-sm opacity-70">Zaten üye misiniz? <a href="#register" class="font-semibold underline">Giriş yapın</a></p>
    </form>
  </div>
</section>
