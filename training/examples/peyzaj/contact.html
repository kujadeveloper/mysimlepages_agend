<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Ücretsiz Keşif</h2>
      <p class="mt-4 text-lg opacity-80">Bahçenizi yerinde görüp ölçüyor, bir hafta içinde tasarım önerisi ve fiyat sunuyoruz.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Telefon:</span> <a href="tel:+902423240077" class="underline">0242 324 00 77</a></p>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="district" class="block font-semibold">İlçe</label><select id="district" name="district" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Konyaaltı</option><option>Muratpaşa</option><option>Lara</option><option>Döşemealtı</option><option>Kemer</option><option>Serik</option></select></div>
        <div><label for="area" class="block font-semibold">Bahçe (m²)</label><input id="area" name="area" type="number" min="20" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="service" class="block font-semibold">İstenen hizmet</label><select id="service" name="service" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Komple bahçe düzenleme</option><option>Rulo çim</option><option>Otomatik sulama</option><option>Aylık bakım</option></select></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Keşif İste</button>
    </form>
  </div>
</section>
