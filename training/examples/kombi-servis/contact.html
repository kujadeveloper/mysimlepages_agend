<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-3xl">
    <h2 class="text-3xl font-bold md:text-4xl">Arıza Bildir</h2>
    <p class="mt-4 text-lg opacity-80">Ekranda bir hata kodu görüyorsanız (ör. F28, E01) yazın; ustamız doğru parçayla gelsin.</p>
    <form class="mt-10 space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="brand" class="block font-semibold">Kombi markası</label><input id="brand" name="brand" type="text" placeholder="Ör. Vaillant, Demirdöküm" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="code" class="block font-semibold">Hata kodu</label><input id="code" name="code" type="text" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="address" class="block font-semibold">Adres</label><textarea id="address" name="address" rows="2" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Servis İste</button>
    </form>
  </div>
</section>
