<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-extrabold uppercase md:text-4xl">Fiyat Alın</h2>
      <p class="mt-4 text-lg opacity-80">Aracınızı ve şikâyetinizi yazın, mesai saatleri içinde 1 saatte fiyatla dönelim.</p>
      <ul class="mt-8 space-y-4">
        <li><span class="font-bold text-[var(--primary)]">Adres:</span> Ostim OSB Mah. 1234. Cad. No: 15, Yenimahalle / Ankara</li>
        <li><span class="font-bold text-[var(--primary)]">Telefon:</span> <a href="tel:+903123850415" class="underline">0312 385 04 15</a></li>
        <li><span class="font-bold text-[var(--primary)]">Saatler:</span> Pazartesi – Cumartesi 08:00 – 19:00</li>

      <div><label for="job" class="block font-semibold">Yapılacak iş veya şikâyet</label><textarea id="job" name="job" rows="4" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Fiyat İste</button>
    </form>
  </div>
</section>
