<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Rezervasyon</h2>
      <p class="mt-4 text-lg opacity-80">Cuma ve cumartesi akşamları masalar erken doluyor. Paket servis Bahçelievler, Emek ve Çankaya'ya.</p>
      <ul class="mt-8 space-y-4">
        <li><span class="font-semibold text-[var(--accent)]">Adres:</span> Bahçelievler Mah. 7. Cad. No: 48, Çankaya / Ankara</li>
        <li><span class="font-semibold text-[var(--accent)]">Rezervasyon:</span> <a href="tel:+903122130092" class="underline">0312 213 00 92</a></li>
        <li><span class="font-semibold text-[var(--accent)]">Paket servis:</span> 12:00 – 22:30</li>
      </ul>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/5 p-6 ring-1 ring-white/10">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
        <div><label for="date" class="block font-semibold">Tarih</label><input id="date" name="date" type="date" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
        <div><label for="time" class="block font-semibold">Saat</label><input id="time" name="time" type="time" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
      </div>
      <div><label for="guests" class="block font-semibold">Kişi sayısı</label><input id="guests" name="guests" type="number" min="1" max="20" value="2" class="mt-2 w-full rounded-lg border border-white/20 bg-white/10 px-4 py-3"></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Masa Ayırt</button>
    </form>
  </div>
</section>
