<section id="appointment" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-[1fr_1.4fr]">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Online Randevu</h2>
      <p class="mt-4 text-lg opacity-80">Saatini seç, 10 dakika içinde SMS ile onaylayalım.</p>
      <div class="mt-8 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
        <h3 class="font-semibold">Çalışma saatleri</h3>
        <ul class="mt-3 space-y-1 text-sm"><li class="flex justify-between"><span>Salı – Cumartesi</span><span>10:00 – 20:00</span></li><li class="flex justify-between"><span>Pazar</span><span>11:00 – 18:00</span></li><li class="flex justify-between opacity-60"><span>Pazartesi</span><span>Kapalı</span></li></ul>
      </div>
    </div>
    <form class="space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div><label for="a-service" class="block font-semibold">Hizmet</label><select id="a-service" name="service" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Kalıcı oje (60 dk)</option><option>Protez tırnak (120 dk)</option><option>Protez dolgu (90 dk)</option><option>Medikal pedikür (60 dk)</option></select></div>
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="a-date" class="block font-semibold">Tarih</label><input id="a-date" name="date" type="date" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="a-time" class="block font-semibold">Saat</label><select id="a-time" name="time" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>10:00</option><option>11:30</option><option>13:00</option><option>14:30</option><option>16:00</option><option>17:30</option><option>19:00</option></select></div>
        <div><label for="a-name" class="block font-semibold">Ad Soyad</label><input id="a-name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="a-phone" class="block font-semibold">Telefon</label><input id="a-phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="a-note" class="block font-semibold">Not (tasarım fikri, renk)</label><textarea id="a-note" name="note" rows="3" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Randevuyu Onayla</button>
    </form>
  </div>
</section>
