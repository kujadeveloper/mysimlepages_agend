<section id="hero" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl items-center gap-12 md:grid-cols-[3fr_2fr]">
    <div>
      <span class="inline-block rounded-full bg-[var(--accent)] px-3 py-1 text-sm font-semibold text-black">Kızılay · Ankara</span>
      <h1 class="mt-6 text-4xl font-bold leading-tight md:text-6xl">Pürüzsüz bir cilt, ağrısız bir deneyim.</h1>
      <p class="mt-6 text-lg opacity-80">Soğutmalı buz lazer, Hydrafacial ve kalıcı makyajda uzman estetisyenler. Her işlemden önce ücretsiz cilt analizi.</p>
    </div>
    <form class="space-y-4 rounded-3xl bg-white p-6 shadow-lg ring-1 ring-black/5">
      <p class="text-lg font-semibold">Ücretsiz Ön Görüşme</p>
      <div><label for="name" class="block text-sm font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="phone" class="block text-sm font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="service" class="block text-sm font-semibold">İşlem</label><select id="service" name="service" class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Buz lazer epilasyon</option><option>Hydrafacial</option><option>Kalıcı makyaj</option><option>Bölgesel incelme</option></select></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Beni Arayın</button>
    </form>
  </div>
</section>
