<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-2xl">
    <h2 class="text-3xl font-bold md:text-4xl">Let's talk about your day</h2>
    <p class="mt-4 text-lg opacity-80">I take on a limited number of weddings each year. Tell me a little about your plans and I'll reply within two days.</p>
    <form class="mt-10 space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="names" class="block text-sm uppercase tracking-widest opacity-70">Your names</label><input id="names" name="names" type="text" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-3"></div>
        <div><label for="email" class="block text-sm uppercase tracking-widest opacity-70">Email</label><input id="email" name="email" type="email" required class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-3"></div>
        <div><label for="date" class="block text-sm uppercase tracking-widest opacity-70">Wedding date</label><input id="date" name="date" type="date" class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-3"></div>
        <div><label for="location" class="block text-sm uppercase tracking-widest opacity-70">Location</label><input id="location" name="location" type="text" placeholder="Istanbul, Cappadocia, Bodrum..." class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-3"></div>
      </div>
      <div><label for="message" class="block text-sm uppercase tracking-widest opacity-70">Tell me about you two</label><textarea id="message" name="message" rows="5" class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-3"></textarea></div>
      <button type="submit" class="inline-block rounded-full bg-[var(--primary)] px-8 py-3 font-semibold text-white hover:opacity-90">Send inquiry</button>
    </form>
  </div>
</section>
