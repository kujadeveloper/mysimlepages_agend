<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Rezervasyon</h2>
      <p class="mt-4 text-lg opacity-80">Önlük bizden; kirlenmesinde sakınca olmayan kıyafetlerle gelin.</p>
      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Atölye:</span> Rasimpaşa Mah. Karakolhane Cad. No: 27, Yeldeğirmeni, Kadıköy / İstanbul</p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">Instagram:</span> <a href="https://instagram.com/toprakanaseramik" class="underline">@toprakanaseramik</a></p>
    </div>
    <form class="space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="type" class="block font-semibold">Etkinlik</label><select id="type" name="type" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Tek seferlik workshop</option><option>Çark kursu</option><option>El şekillendirme kursu</option><option>Şirket etkinliği</option></select></div>
        <div><label for="people" class="block font-semibold">Kişi sayısı</label><input id="people" name="people" type="number" min="1" max="12" value="2" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="date" class="block font-semibold">Tarih</label><input id="date" name="date" type="date" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Yer Ayırt</button>
    </form>
  </div>
</section>
