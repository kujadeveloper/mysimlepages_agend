<section id="order-tracking" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-4xl items-center gap-10 md:grid-cols-2">
    <div>
      <h2 class="text-3xl font-bold md:text-4xl">Siparişim nerede?</h2>
      <p class="mt-4 opacity-80">Sipariş numaranız SMS ile gönderildi. Kargo takip numarası kargoya verildiği gün eklenir.</p>
    </div>
    <form class="space-y-4 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <div><label for="t-order" class="block font-semibold">Sipariş numarası</label><input id="t-order" name="order" type="text" placeholder="BK-" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <div><label for="t-phone" class="block font-semibold">Telefon</label><input id="t-phone" name="phone" type="tel" placeholder="05xx xxx xx xx" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      <button type="submit" class="w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Sorgula</button>
    </form>
  </div>
</section>
