<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-5xl gap-12 md:grid-cols-2">
    <div>
      <h2 class="text-4xl">İletişim</h2>
      <p class="mt-4 opacity-80">Hafta içi 09:00 – 18:00</p>
      <p class="mt-6"><span class="font-semibold">Telefon:</span> <a href="tel:+902588140068" class="underline">0258 814 00 68</a></p>
      <p class="mt-2"><span class="font-semibold">E-posta:</span> <a href="mailto:merhaba@pamukveketen.com" class="underline">merhaba@pamukveketen.com</a></p>
    </div>
    <form class="space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <div><label for="c-name" class="block text-sm font-semibold">Ad Soyad</label><input id="c-name" name="name" type="text" required class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="c-email" class="block text-sm font-semibold">E-posta</label><input id="c-email" name="email" type="email" required class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <div><label for="c-subject" class="block text-sm font-semibold">Konu</label><select id="c-subject" name="subject" class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Sipariş</option><option>İade / değişim</option><option>Toptan satış</option><option>Diğer</option></select></div>
      <div><label for="c-message" class="block text-sm font-semibold">Mesajınız</label><textarea id="c-message" name="message" rows="4" required class="mt-1 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></textarea></div>
      <button type="submit" class="rounded-full bg-[var(--primary)] px-8 py-3 font-semibold text-white hover:opacity-90">Gönder</button>
    </form>
  </div>
</section>
