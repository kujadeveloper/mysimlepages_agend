<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">

      <p class="mt-8"><span class="font-semibold text-[var(--primary)]">Adres:</span> Osmanağa Mah. Söğütlüçeşme Cad. No: 52 Kat: 3, Kadıköy / İstanbul</p>
      <p class="mt-2"><span class="font-semibold text-[var(--primary)]">Telefon:</span> <a href="tel:+902163300052" class="underline">0216 330 00 52</a></p>

        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>

        <div><label for="level" class="block font-semibold">Seviyeniz</label><select id="level" name="level" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>Hiç bilmiyorum</option><option>Başlangıç</option><option>Orta</option><option>İleri</option></select></div>
      </div>
