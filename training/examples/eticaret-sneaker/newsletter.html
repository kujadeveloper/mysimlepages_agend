<section id="newsletter" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-4xl rounded-3xl bg-[var(--primary)] p-10 text-center text-white md:p-14">
    <h2 class="text-4xl font-black uppercase italic">Never miss a restock</h2>
    <p class="mt-4 opacity-80">Drop reminders 24 hours early and restock alerts in your size.</p>
    <form class="mx-auto mt-8 flex max-w-lg flex-col gap-3 sm:flex-row">
      <label for="nl-email" class="sr-only">Email</label>
      <input id="nl-email" name="email" type="email" required placeholder="you@email.com" class="w-full rounded-full bg-white px-5 py-3 text-black">
      <button type="submit" class="rounded-full bg-[var(--accent)] px-6 py-3 font-bold uppercase text-black hover:opacity-90">Sign up</button>
    </form>
  </div>
</section>
