<section id="contact" class="px-6 py-16 md:py-24">
  <div class="mx-auto max-w-3xl">
    <h2 class="text-3xl font-bold md:text-4xl">Ücretsiz Teklif Al</h2>
    <p class="mt-4 text-lg opacity-80">Formu doldurun, 1 saat içinde sizi arayalım. Acil taşınmalar için: <a href="tel:+902242550016" class="font-semibold text-[var(--primary)] underline">0224 255 00 16</a></p>
    <form class="mt-10 space-y-5 rounded-2xl bg-white/70 p-6 shadow-sm ring-1 ring-black/5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="name" class="block font-semibold">Ad Soyad</label><input id="name" name="name" type="text" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="phone" class="block font-semibold">Telefon</label><input id="phone" name="phone" type="tel" required class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="from" class="block font-semibold">Nereden</label><input id="from" name="from" type="text" placeholder="Ör. Nilüfer, Bursa" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="to" class="block font-semibold">Nereye</label><input id="to" name="to" type="text" placeholder="Ör. Kadıköy, İstanbul" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
        <div><label for="size" class="block font-semibold">Ev tipi</label><select id="size" name="size" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"><option>1+1</option><option>2+1</option><option>3+1</option><option>4+1 ve üzeri</option></select></div>
        <div><label for="date" class="block font-semibold">Taşınma tarihi</label><input id="date" name="date" type="date" class="mt-2 w-full rounded-lg border border-black/10 bg-white px-4 py-3"></div>
      </div>
      <button type="submit" class="inline-block w-full rounded-full bg-[var(--primary)] px-6 py-3 font-semibold text-white hover:opacity-90">Teklif İste</button>
    </form>
  </div>
</section>
