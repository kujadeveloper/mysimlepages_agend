# Ajan + Ollama (GPU). Ollama modeli GPU'da tutar, ajan hafif kalır.
# İlk çalıştırma: docker compose up -d && docker compose exec ollama ollama pull qwen2.5-coder:3b
services:
  agent:
    build: .
    env_file: .env
    environment:
      MSP_BACKEND: openai
      MSP_OPENAI_BASE_URL: http://ollama:11434/v1
    volumes:
      - agent-data:/data
    ports:
      - "127.0.0.1:8100:8100"   # yalnızca iç ağ / backend erişsin
    depends_on: [ollama]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"        # model bellekte kalsın, her istekte yüklenmesin
      OLLAMA_NUM_PARALLEL: "1"        # düşük VRAM: tek istek
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"    # KV önbelleği yarı bellek
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  agent-data:
  ollama:
