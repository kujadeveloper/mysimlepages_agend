[project]
name = "mysimplepages-agent"
version = "0.1.0"
description = "MySimplePage AI site tasarım ajanı: metinden web sitesi (HTML + Tailwind) üretir; eğitilebilir, sürümlü."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Yerel GGUF modeli (düşük VRAM / CPU): CUDA için CMAKE_ARGS="-DGGML_CUDA=on" ile kurun
llamacpp = ["llama-cpp-python>=0.3"]
# QLoRA eğitimi (6-8 GB VRAM yeterli). bitsandbytes yalnızca CUDA (Linux/Windows); macOS'ta MPS/CPU ile tam LoRA.
train = ["torch>=2.3", "transformers>=4.56", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33",
         "bitsandbytes>=0.43; sys_platform != 'darwin'"]
dev = ["pytest>=8"]

[project.scripts]
msp-agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "training*"]

[tool.setuptools.package-data]
agent = ["prompts/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
