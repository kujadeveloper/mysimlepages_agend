# NVIDIA GPU eki (Linux + nvidia-container-toolkit, ya da Windows + Docker Desktop/WSL2). macOS'ta kullanmayın.
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
